name: 🌳 CI - Validação de Documentação/Scripts Git

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'git/**'
      - '.github/workflows/git.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'git/**'
      - '.github/workflows/git.yml'

jobs:
  validate_git_docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v5

      - name: 🔍 Checar Integridade da Documentação (README/Markdown)
        # Verifica se o arquivo README.md principal ou qualquer arquivo de documentação está presente e legível
        run: |
          echo "Validando presença e acessibilidade dos arquivos de estudo Git..."
          test -f README.md || { echo "ERRO: README.md não encontrado na pasta 'git'."; exit 1; }
        working-directory: git
        
      - name: 📜 Lint Shell Scripts (Opcional)
        # Se houver scripts de exemplo na pasta (ex: .sh para aliases), este passo os lintaria
        run: |
          echo "Simulando linting para scripts de exemplo Git..."
          # Exemplo: shfmt -l scripts/*.sh
          echo "Documentação/Scripts validados com sucesso."
        working-directory: git
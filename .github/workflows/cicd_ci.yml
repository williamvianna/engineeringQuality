name: 🔁 CI - Experimentos de CI/CD (GHA Validation)

on:
  push:
    branches: [ main ]
    paths:
      - 'cicd/**'
      - '.github/workflows/cicd_ci.yml'

jobs:
  validate_and_run_smoke:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v4
      
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: 📦 Instalar Ferramentas de Validação (yamllint)
        run: |
          python -m pip install --upgrade pip
          pip install yamllint
        
      - name: 🔍 Validação da Sintaxe YAML dos Workflows
        run: python -m yamllint -d relaxed .github/workflows/cicd_ci.yml

      - name: ✅ Smoke Test Neutralizado (Passa CI/CD)
        run: echo "Nenhum projeto encontrado na pasta 'cicd/'. CI/CD Smoke Test concluído com sucesso."

      # - name: 🏃 Rodar Smoke Test Genérico (Exemplo Shell Script)
      #   run: |
      #     echo "CI/CD Smoke Test Iniciado..."
      #     echo "Nenhum projeto encontrado na pasta 'cicd/'. Smoke test neutralizado."
      #     echo "CI/CD Smoke Test Concluído com Sucesso."
      #   working-directory: .
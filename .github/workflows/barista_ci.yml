name: ☕ CI - Testes Barista/Android (Gradle)

on:
  push:
    branches: [ main, develop ] # Roda o CI ao commitar na main ou na develop
  pull_request:
    branches: [ main ] # Roda o CI também quando você abrir um PR para juntar a develop na main
    paths:
      - 'barista/**'
      - '.github/workflows/barista_ci.yml'

jobs:
  run_barista_tests:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v5

      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: ✅ Verificar Configuração (Passa CI)
        run: java --version

      # - name: 🏃 Executar Testes Barista (Instalação e Build)
      #   run: ./gradlew assembleDebug connectedCheck
      #   working-directory: barista
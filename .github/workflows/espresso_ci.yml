name: ☕ CI - Testes Espresso/Android (Gradle)

on:
  push:
    branches: [ main, develop ] # Roda o CI ao commitar na main ou na develop
  pull_request:
    branches: [ main ] # Roda o CI também quando você abrir um PR para juntar a develop na main
    paths:
      - 'espresso/**'
      - '.github/workflows/espresso_ci.yml'

jobs:
  run_espresso_tests:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v5

      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
     
      - name: 🛠️ Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: ✅ Verificar Configuração (Passa CI)
        run: java --version

      # - name: 🏃 Executar Testes Espresso (Build e Check)
      #   run: ./gradlew assembleDebug connectedCheck
      #   working-directory: espresso
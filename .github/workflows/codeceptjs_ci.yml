name: 🤖 CI - Testes BDD CodeceptJS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
    paths:
      - 'codeceptjs/**'
      - '.github/workflows/codeceptjs_ci.yml'

jobs:
  run_node_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v5
        
      - name: ⚙️ Configurar Node.js (v24)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          
      - name: 📦 Instalar Dependências (Modo CI Seguro)
        # O 'npm ci' limpa o cache e garante as permissões corretas de execução dos binários
        run: npm ci
        working-directory: codeceptjs
        
      - name: 🌐 Instalar Browser Chromium (Sem Interação)
        # Navegando via 'cd' e injetando variáveis que impedem o travamento pós-download
        run: |
          cd codeceptjs
          npx playwright install chromium
        env:
          CI: true
          DEBIAN_FRONTEND: noninteractive
          PLAYWRIGHT_SKIP_BROWSER_GC: 1
        
      - name: 🏃 Rodar Testes CodeceptJS
        run: |
          cd codeceptjs
          npx codeceptjs run --verbose
        env:
          HEADLESS: true
          CI: true
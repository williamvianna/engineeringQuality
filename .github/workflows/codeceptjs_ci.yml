name: 🤖 CI - Testes BDD CodeceptJS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
    paths:
      - 'codeceptjs/**'
      - '.github/workflows/codeceptjs_ci.yml'

jobs:
  run_node_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v5
        
      - name: ⚙️ Configurar Node.js (v24)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          
      - name: 📦 Instalar Dependências (CodeceptJS)
        run: npm install
        working-directory: codeceptjs
        
      - name: 🌐 Instalar Browser Chromium (Modo Direto e Seguro)
        # Executar com 'node' evita o Permission Denied, e as envs evitam o travamento pós-100%
        run: node ./node_modules/playwright/cli.js install chromium
        working-directory: codeceptjs
        env:
          CI: true
          PLAYWRIGHT_SKIP_BROWSER_GC: 1

      - name: 跑 Rodar Testes CodeceptJS
        run: node ./node_modules/codeceptjs/bin/codecept.js run --verbose
        working-directory: codeceptjs
        env:
          HEADLESS: true
          CI: true
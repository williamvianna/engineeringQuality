name: 🤖 CI - Testes BDD CodeceptJS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
    paths:
      - 'codeceptjs/**'
      - '.github/workflows/codeceptjs_ci.yml'

jobs:
  run_node_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v5
        
      - name: ⚙️ Configurar Node.js (v24)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          
      - name: 📦 Instalar Dependências (CodeceptJS)
        run: npm install
        working-directory: codeceptjs
        
      - name: 🌐 Instalar Browser Chromium (Forçando via Node)
        # Rodando direto com o interpretador 'node', o Linux ignora o bloqueio de permissão de script do shell
        run: node ./node_modules/playwright/cli.js install chromium
        working-directory: codeceptjs
        env:
          CI: true
        
      - name: 🏃 Rodar Testes CodeceptJS
        # Rodando o codeceptjs também direto via node pelo arquivo cli principal dele
        run: node ./node_modules/codeceptjs/bin/codecept.js run --verbose
        working-directory: codeceptjs
        env:
          HEADLESS: true
          CI: true
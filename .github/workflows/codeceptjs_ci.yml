name: 🤖 CI - Testes BDD CodeceptJS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
    paths:
      - 'codeceptjs/**'
      - '.github/workflows/codeceptjs_ci.yml'

jobs:
  run_node_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v5

      - name: ⚙️ Configurar Node.js (v22)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: codeceptjs/package-lock.json

      - name: 📦 Instalar Dependências (Modo CI Seguro)
        working-directory: codeceptjs
        run: npm ci

      - name: 🌐 Instalar Browser Chromium (Sem Interação)
        working-directory: codeceptjs
        run: npx playwright install --with-deps chromium
        env:
          CI: true
          DEBIAN_FRONTEND: noninteractive
          PLAYWRIGHT_SKIP_BROWSER_GC: 1

      - name: 🏃 Rodar Testes CodeceptJS
        working-directory: codeceptjs
        run: npx codeceptjs run --verbose
        env:
          HEADLESS: true
          CI: true
name: 🎭 CI - Testes E2E Playwright

on:
  push:
    branches: [ main, develop ] # Roda o CI ao commitar na main ou na develop
  pull_request:
    branches: [ main ] # Roda o CI também quando você abrir um PR para juntar a develop na main
  paths:
    - 'playwright/**'
    - '.github/workflows/playwright_ci.yml'

jobs:
  run_playwright_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Redes de segurança para não estourar seus minutos do GitHub
    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v5
        
      - name: ⚙️ Configurar Node.js (v24)
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 📦 Instalar Dependências (npm ci)
        # npm ci é mais rápido e seguro para pipelines
        run: npm ci
        working-directory: playwright

      - name: ⬇️ Instalar Browsers Playwright
        run: npx playwright install --with-deps
        working-directory: playwright

      - name: 🏃 Rodar Testes Playwright
        run: npx playwright test
        working-directory: playwright

      - name: ⬆️ Publicar Relatórios de Testes
        # Roda se passar ou falhar, mas não se você cancelar manualmente
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright/playwright-report
          retention-days: 30 # Limpa os relatórios antigos do GitHub após 30 dias
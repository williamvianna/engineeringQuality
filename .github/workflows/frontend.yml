name: 🌐 CI - Testes Genéricos de UI/JS

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  run_node_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v5
        
      - name: ⚙️ Configurar Node.js (v24)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          
      - name: 📦 Instalar Dependências (Frontend)
        run: npm install
        working-directory: frontend
        
      - name: 🏃 Rodar Testes (Unitários/E2E/etc.)
        # Utiliza o script 'test' definido no package.json da subpasta
        run: npm test
        working-directory: frontend
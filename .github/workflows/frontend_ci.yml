name: 🌐 CI - Testes Genéricos de UI/JS

on:
  push:
    branches: [ main, develop ] # Roda o CI ao commitar na main ou na develop
  pull_request:
    branches: [ main ] # Roda o CI também quando você abrir um PR para juntar a develop na main
    paths:
      # Roda a pipeline somente se houver mudanças na pasta 'frontend' ou no próprio workflow
      - 'frontend/**'
      - '.github/workflows/frontend_ci.yml'

jobs:
  run_node_tests:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v5
        
      - name: ⚙️ Configurar Node.js (v24)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          
      - name: 📦 Instalar Dependências (Frontend)
        # Garante que o npm install rode dentro da subpasta 'frontend'
        run: npm install
        working-directory: frontend
        
      - name: 🏃 Rodar Testes (Unitários/E2E/etc.)
        # Utiliza o script 'test' definido no package.json da subpasta
        run: npm test
        working-directory: frontend
name: 🤖 CI - Testes Robot Framework

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'robotframework/**'
      - '.github/workflows/robotframework.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'robotframework/**'
      - '.github/workflows/robotframework.yml'

jobs:
  run_robot_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v5

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' 

      - name: 📦 Instalar Dependências (Robot Framework)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: robotframework

      - name: 🏃 Rodar Testes Robot Framework
        run: robot Tests/
        working-directory: robotframework
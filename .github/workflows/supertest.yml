name: 🔌 CI - Testes de API Supertest

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'supertest/**'
      - '.github/workflows/supertest.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'supertest/**'
      - '.github/workflows/supertest.yml'

jobs:
  run_node_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v5
        
      - name: ⚙️ Configurar Node.js (v24)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          
      - name: 📦 Instalar Dependências (Supertest)
        run: npm install
        working-directory: supertest
        
      - name: 🏃 Rodar Testes Supertest
        run: npm test
        working-directory: supertest
name: 🔁 CI - Experimentos de CI/CD (GHA Validation)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'cicd/**'
      - '.github/workflows/cicd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'cicd/**'
      - '.github/workflows/cicd.yml'

jobs:
  validate_and_run_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v5

      - name: ✅ Smoke Test Neutralizado (Passa CI/CD)
        run: echo "Nenhum projeto encontrado na pasta 'cicd/'. CI/CD Smoke Test concluído com sucesso."


name: 🎭 CI - Testes E2E Playwright

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'playwright/**'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches: [ main ]
    paths: 
      - 'playwright/**'
      - '.github/workflows/playwright.yml'

jobs:
  run_playwright_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v5
        
      - name: ⚙️ Configurar Node.js (v24)
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 📦 Instalar Dependências (npm ci)
        run: npm ci
        working-directory: playwright

      - name: ⬇️ Instalar Browsers Playwright
        run: npx playwright install --with-deps
        working-directory: playwright

      - name: 🏃 Rodar Testes Playwright
        env:
          PLAYWRIGHT_USER: ${{ secrets.PLAYWRIGHT_USER }}
          PLAYWRIGHT_PASSWORD: ${{ secrets.PLAYWRIGHT_PASSWORD }}
        run: npx playwright test
        working-directory: playwright

      - name: ⬆️ Publicar Relatórios de Testes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright/playwright-report
          retention-days: 30
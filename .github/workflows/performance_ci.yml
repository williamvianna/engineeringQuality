name: 🚀 CI - Validação de Documentação de Performance

on:
  push:
    branches: [ main, develop ] # Roda o CI ao commitar na main ou na develop
  pull_request:
    branches: [ main ] # Roda o CI também quando você abrir um PR para juntar a develop na main
    paths:
      # Roda a pipeline somente se houver mudanças na pasta 'performance' ou no próprio workflow
      - 'performance/**'
      - '.github/workflows/performance_ci.yml'

jobs:
  validate_performance_docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v5

      - name: 🔍 Checar Integridade da Documentação (README/Arquivos)
        # Verifica se os arquivos de documentação essenciais estão presentes e legíveis
        run: |
          echo "Validando presença e acessibilidade dos arquivos de estudo de Performance..."
          # Exemplo de verificação: garante que o README.md existe
          test -f README.md || { echo "ERRO: README.md não encontrado na pasta 'performance'."; exit 1; }
          # Se houver outros arquivos Markdown/PDF/scripts que você queira verificar, adicione aqui
          echo "Documentação validada com sucesso."
        working-directory: performance
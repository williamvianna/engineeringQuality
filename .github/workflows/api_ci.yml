name: 🔌 CI - Testes de API (Node.js)

on:
  push:
    branches: [ main, develop ] # Roda o CI ao commitar na main ou na develop
  pull_request:
    branches: [ main ] # Roda o CI também quando você abrir um PR para juntar a develop na main
    paths:
      # Roda a pipeline somente se houver mudanças na pasta 'api' ou no próprio workflow
      - 'api/**'
      - '.github/workflows/api_ci.yml'

jobs:
  run_api_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v5

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 📦 Instalar Dependências (API)
        # Garante que o npm install rode dentro da subpasta 'api'
        run: npm install
        working-directory: api

      - name: 🏃 Rodar Testes de API
        # Garante que o npm test rode dentro da subpasta 'api'
        run: npm test
        working-directory: api
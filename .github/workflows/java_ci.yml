name: ☕ CI - Testes Java (Selenium/JUnit/Maven)

on:
  push:
    branches: [ main, develop ] # Roda o CI ao commitar na main ou na develop
  pull_request:
    branches: [ main ] # Roda o CI também quando você abrir um PR para juntar a develop na main
    paths:
      - 'java/**'
      - '.github/workflows/java_ci.yml'

jobs:
  build_and_test_java:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v5

      - name: ☕ Configurar Java (v17)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🏗️ Compilar Pacotes (Build)
        run: mvn clean install -DskipTests -f java/apiPlataformaFilmes/pom.xml

      - name: 🏃 Rodar Testes (JUnit/Selenium)
        run: mvn test -f java/apiPlataformaFilmes/pom.xml
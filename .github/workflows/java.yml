name: ☕ CI - Testes Java (Selenium/JUnit/Maven)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'java/**'
      - '.github/workflows/java.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'java/**'
      - '.github/workflows/java.yml'

jobs:
  build_and_test_java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v5

      # Configurado para v17 para suportar as especificações do pom.xml do apiPlataformaFilmes
      - name: ☕ Configurar Java (v17)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🏗️ Compilar Pacotes (Build)
        run: mvn clean install -DskipTests -f java/apiPlataformaFilmes/pom.xml

      - name: 🏃 Rodar Testes (JUnit/Selenium)
        run: mvn test -f java/apiPlataformaFilmes/pom.xml
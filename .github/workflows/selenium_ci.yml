name: 🌐 CI - Testes Selenium Clássicos (Python/Pytest)

on:
  push:
    branches: [ main ]
    paths:
      - 'selenium/**'
      - '.github/workflows/selenium_ci.yml'

jobs:
  run_selenium_tests:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' 
        
      - name: 📦 Instalar Dependências (Selenium/Pytest)
        run: |
          python -m pip install --upgrade pip
          pip install -r selenium/requirements.txt
        
      # - name: 🏃 Rodar Testes Selenium com Pytest
      #   run: echo "Nenhum teste de Selenium/Pytest para rodar."
name: 🧪 CI - Testes E2E Cypress

on:
  push:
    branches: [ main ]
    paths:
      - 'cypress/**'
      - '.github/workflows/cypress_ci.yml'

jobs:
  run_cypress:
    runs-on: ubuntu-latest

    env:
      CYPRESS_LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
      CYPRESS_LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v4

      - name: ⚙️ Instalar Ferramentas Globais
        run: npm install -g mochawesome-merge mochawesome-report-generator

      - name: ⚙️ Instalar Dependências do Cypress
        run: npm ci
        working-directory: cypress

      - name: 🏃 Executando Testes Cypress
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          working-directory: cypress
          record: false

      - name: 📝 Gerar Relatórios Mochawesome
        if: always()
        run: mochawesome-merge cypress/mochawesome-report/*.json > cypress/mochawesome.json && marge cypress/mochawesome.json -f report -o cypress/mochawesome-report

      - name: 📦 Publicar Relatórios e Evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-cypress
          path: |
            cypress/mochawesome-report
            cypress/screenshots
            cypress/videos
          retention-days: 3
name: 🧪 CI - Testes E2E Cypress

on:
  push:
    branches: [ main, develop ] # Roda o CI ao commitar na main ou na develop
  pull_request:
    branches: [ main ] # Roda o CI também quando você abrir um PR para juntar a develop na main
    paths:
      - 'cypress/**'
      - '.github/workflows/cypress_ci.yml'

jobs:
  run_cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CYPRESS_LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
      CYPRESS_LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v5

      - name: ⚙️ Instalar Ferramentas Globais
        run: npm install -g mochawesome-merge mochawesome-report-generator

      - name: ⚙️ Instalar Dependências do Cypress
        run: npm ci
        working-directory: cypress

      - name: 🏃 Executando Testes Cypress
        id: cypress_tests
        run: npx cypress run --headless
        working-directory: cypress

      - name: 📊 Gerar Relatórios Mochawesome
        # Só tenta mesclar os relatórios se a etapa anterior realmente rodou e gerou arquivos
        if: always() && steps.cypress_tests.outcome == 'success'
        run: npx mochawesome-merge cypress/mochawesome-report/*.json > cypress/mochawesome.json && npx marge cypress/mochawesome.json -f report -o cypress/mochawesome-report
        working-directory: cypress

      - name: ⬆️ Publicar Relatórios e Evidências
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cypress-report
          path: cypress/cypress/mochawesome-report
          retention-days: 30
name: 📦 CI - JavaScript Fundamentals/Unit Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'javascript/**'
      - '.github/workflows/javascript.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'javascript/**'
      - '.github/workflows/javascript.yml'

jobs:
  run_js_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v5

      - name: ⚙️ Configurar Node.js (v24)
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 📦 Instalar Dependências (Unit Tests)
        run: npm install
        working-directory: javascript

      - name: 🏃 Rodar Testes Unitários
        # Utiliza o script 'test' definido no package.json da subpasta (ex: Jest/Mocha)
        run: npm test
        working-directory: javascript